<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/doctorhub_dashboard/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="DoctorHub — The modern healthcare management dashboard for doctors, clinics, and administrators.">
  <meta name="theme-color" content="#6366F1">

  <!-- Open Graph -->
  <meta property="og:title" content="DoctorHub Dashboard">
  <meta property="og:description" content="The modern healthcare management platform.">
  <meta property="og:type" content="website">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="manifest" href="manifest.json">

  <!-- Preconnect for Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <title>DoctorHub — Healthcare Dashboard</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: #09090B;
      font-family: 'Inter', sans-serif;
    }

    #loading-overlay {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #09090B 0%, #0F0F1A 50%, #16213E 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease;
    }

    #loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loader-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 40px;
    }

    .loader-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: linear-gradient(135deg, #6366F1, #8B5CF6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }

    .loader-title {
      font-size: 28px;
      font-weight: 700;
      color: #FAFAFA;
      letter-spacing: -0.5px;
    }

    .loader-title span {
      background: linear-gradient(135deg, #6366F1, #8B5CF6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .loader-ring {
      width: 40px;
      height: 40px;
      border: 3px solid #27272A;
      border-top-color: #6366F1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loader-text {
      margin-top: 16px;
      font-size: 13px;
      color: #71717A;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div id="loading-overlay">
    <div class="loader-logo">
      <div class="loader-icon">🏥</div>
      <div class="loader-title">Doctor<span>Hub</span></div>
    </div>
    <div class="loader-ring"></div>
    <div class="loader-text">Loading your dashboard…</div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function() {
      const overlay = document.getElementById('loading-overlay');
      overlay.classList.add('hidden');
      setTimeout(() => overlay.remove(), 600);
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
