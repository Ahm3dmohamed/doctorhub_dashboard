name: doctorhub_dashboard
description: "DoctorHub — Production-ready Flutter Web Healthcare Dashboard"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.7

  # Navigation
  go_router: ^14.6.2

  # Dependency Injection
  get_it: ^8.0.3

  # Networking
  dio: ^5.7.0

  # Local Storage
  shared_preferences: ^2.3.3

  # Fonts
  google_fonts: ^6.2.1

  # Functional Programming (Either, Option)
  dartz: ^0.10.1

  # Utilities
  intl: ^0.20.2
  flutter_gen: ^5.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - web/icons/
    # - assets/icons/
